<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · USC Marketplace</title>
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <header id="site-nav"></header>

  <main class="page">
    <form id="register-form" class="form-card" novalidate>
      <h1>Create your account</h1>
      <p class="form-intro">For USC students and alumni. You need a usc.edu email.</p>

      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="email">USC email</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="ttrojan@usc.edu" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <p class="field-hint">At least 8 characters.</p>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
      </div>

      <fieldset class="field" id="accountType">
        <legend>I am a</legend>
        <div class="choice-row">
          <label><input type="radio" name="accountType" value="STUDENT"> Student</label>
          <label><input type="radio" name="accountType" value="ALUMNI"> Alumni</label>
        </div>
      </fieldset>

      <button type="submit" class="btn btn-primary btn-block" id="register-button">Register</button>

      <p class="form-footer">Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </main>

  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
