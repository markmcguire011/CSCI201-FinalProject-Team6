<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Profile · USC Marketplace</title>
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <header id="site-nav"></header>

  <main class="page">
    <form id="profile-form" class="form-card" novalidate hidden>
      <h1>Edit Profile</h1>
      <p class="form-intro">This is what other students see on your profile.</p>

      <div class="field" id="photo-field">
        <span class="field-label">Photo</span>
        <div class="photo-editor">
          <div class="profile-photo profile-photo-small" id="photo-preview"></div>
          <div class="photo-buttons">
            <label class="btn btn-secondary" for="photo">Upload new photo</label>
            <input class="visually-hidden" type="file" id="photo" name="photo" accept="image/jpeg,image/png">
            <button type="button" class="btn btn-secondary" id="remove-photo">Remove photo</button>
          </div>
        </div>
        <p class="field-hint">JPG or PNG, up to 5 MB.</p>
      </div>

      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" autocomplete="name" required>
        <p class="counter" id="fullName-counter">0/50</p>
      </div>

      <div class="field">
        <label for="bio">Bio <span class="label-note">(optional)</span></label>
        <textarea id="bio" name="bio"></textarea>
        <p class="counter" id="bio-counter">0/300</p>
      </div>

      <dl class="readonly-fields">
        <div>
          <dt>USC email</dt>
          <dd id="email"></dd>
        </div>
        <div>
          <dt>Account type</dt>
          <dd id="accountType"></dd>
        </div>
      </dl>
      <p class="field-hint">Your email and account type can't be changed.</p>

      <div class="form-buttons">
        <a class="btn btn-secondary" id="cancel-button" href="profile.html">Cancel</a>
        <button type="submit" class="btn btn-primary" id="save-button" data-requires="EDIT_OWN">Save</button>
      </div>
    </form>
  </main>

  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/access.js"></script>
  <script src="js/edit-profile.js"></script>
</body>
</html>
