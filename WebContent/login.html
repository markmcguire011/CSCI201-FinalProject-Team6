
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In · USC Marketplace</title>

    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <header id="site-nav"></header>

    <main class="page">
        <form id="login-form" class="form-card" novalidate>
            <h1>Log In</h1>

            <p class="form-intro">
                Welcome back to USC Marketplace.
                Sign in with your USC account.
            </p>

            <div class="field">
                <label for="email">USC email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="ttrojan@usc.edu"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <p id="login-error" class="form-error"
               role="alert" hidden></p>

            <button type="submit"
                    id="login-button"
                    class="btn btn-primary btn-block">
                Log In
            </button>

            <p class="form-footer">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>
        </form>
    </main>

    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
